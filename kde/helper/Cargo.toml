[package]
name = "codex-usage-helper"
version = "6.3.0"
edition = "2021"
description = "Codex Usage plasmoid backend: ChatGPT subscription limits, local session telemetry, and snapshot server"
license = "MIT"

[[bin]]
name = "codex-usage-helper"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

[profile.release]
opt-level = 2
lto = true
strip = true
