name: Publish Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
  build-and-publish:
    needs: check-release
    if: needs.check-release.outputs.publish == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag and package version
        shell: zsh {0}
        run: |
          version="$(<VERSION)"
          [[ "${GITHUB_REF_NAME#v}" == "$version" ]]

      - name: Import Developer ID signing certificate
        env:
          DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        shell: zsh {0}
        run: |
          [[ -n "$DEVELOPER_ID_CERTIFICATE_BASE64" ]] || { print -u2 "Missing DEVELOPER_ID_CERTIFICATE_BASE64 repository secret."; exit 1; }
          [[ -n "$DEVELOPER_ID_CERTIFICATE_PASSWORD" ]] || { print -u2 "Missing DEVELOPER_ID_CERTIFICATE_PASSWORD repository secret."; exit 1; }
          keychain_password="$(/usr/bin/openssl rand -hex 24)"
          export CODEX_BUILD_KEYCHAIN_PASSWORD="$keychain_password"
          print -r -- "CODEX_BUILD_KEYCHAIN_PASSWORD=$keychain_password" >> "$GITHUB_ENV"
          Scripts/import-developer-id-certificate.sh

      - name: Build universal widget and Mac installers
        env:
          CODEX_SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          CODEX_REQUIRE_SIGNING: "1"
        run: Scripts/build-mac-mini-installer.sh

      - name: Validate v4 package
        env:
          CODEX_REQUIRE_SIGNING: "1"
        run: Scripts/validate-v4.sh

      - name: Notarize and staple release artifacts
        env:
          CODEX_SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_NOTARY_APP_SPECIFIC_PASSWORD }}
        run: Scripts/notarize-release.sh

      - name: Sign Sparkle update feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY"
          Scripts/generate-appcast.sh

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: zsh {0}
        run: |
          version="$(<VERSION)"
          assets=(
            "Dist/CodexUsage-v$version.zip"
            "Dist/appcast.xml"
            "Dist/Codex Usage for DockDoor Pro v$version.dmg"
          )

          notes_file="docs/RELEASE-$version.md"
          if [[ -f "$notes_file" ]]; then
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
                --title "Codex Usage Widget v$version" \
                --notes-file "$notes_file" \
                --verify-tag
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
                --title "Codex Usage Widget v$version" \
                --generate-notes \
                --verify-tag
          fi
